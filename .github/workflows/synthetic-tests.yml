name: Synthetic paper-core tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m examples.paper_demo
      - name: Verify synthetic replay and checkpoint recovery
        run: |
          python -m leek.replay --config examples/fixtures/replay-config.json --input examples/fixtures/replay-bars.json --output "$RUNNER_TEMP/leek-full"
          python -m leek.replay --config examples/fixtures/replay-config.json --input examples/fixtures/replay-bars.json --output "$RUNNER_TEMP/leek-part" --stop-after 3
          python -m leek.replay --config examples/fixtures/replay-config.json --input examples/fixtures/replay-bars.json --output "$RUNNER_TEMP/leek-resumed" --resume "$RUNNER_TEMP/leek-part/checkpoint.json"
          cmp "$RUNNER_TEMP/leek-full/report.json" "$RUNNER_TEMP/leek-resumed/report.json"
          cmp "$RUNNER_TEMP/leek-full/checkpoint.json" "$RUNNER_TEMP/leek-resumed/checkpoint.json"
      - name: Verify synthetic portfolio shared-cash recovery
        run: |
          python -m leek.portfolio_replay --config examples/fixtures/portfolio-config.json --input examples/fixtures/portfolio-bars.json --output "$RUNNER_TEMP/portfolio-full"
          python -m leek.portfolio_replay --config examples/fixtures/portfolio-config.json --input examples/fixtures/portfolio-bars.json --output "$RUNNER_TEMP/portfolio-part" --stop-after 3
          python -m leek.portfolio_replay --config examples/fixtures/portfolio-config.json --input examples/fixtures/portfolio-bars.json --output "$RUNNER_TEMP/portfolio-resumed" --resume "$RUNNER_TEMP/portfolio-part/checkpoint.json"
          cmp "$RUNNER_TEMP/portfolio-full/report.json" "$RUNNER_TEMP/portfolio-resumed/report.json"
          cmp "$RUNNER_TEMP/portfolio-full/checkpoint.json" "$RUNNER_TEMP/portfolio-resumed/checkpoint.json"
