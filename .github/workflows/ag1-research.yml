name: AG1 public research capsule
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Focused synthetic tests (no downloaded prices)
        run: python research/ag1/run_public_tests.py
      - name: Verify all public derived paths and frozen decision
        run: python research/ag1/verify_results.py
